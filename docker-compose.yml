services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoroute
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d ecoroute"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:?Set COMPOSE_DATABASE_URL in .env}
      PORT: 4000
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-85}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4000}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  simulator:
    build: .
    command: ["node", "dist/simulator/index.js"]
    environment:
      API_URL: http://api:4000
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-15000}
      SENSOR_API_KEY: ${SENSOR_API_KEY:-}
    depends_on:
      api: { condition: service_healthy }
  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "api:4000", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    restart: always
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
